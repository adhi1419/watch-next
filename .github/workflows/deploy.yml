name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: watch-next-500021
  REGION: europe-west3
  SERVICE: watch-next
  IMAGE: europe-west3-docker.pkg.dev/watch-next-500021/watch-next/watch-next

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBG3i2KLxYvgaYd0r08Kf9fzHmXBongNUQ
          VITE_FIREBASE_AUTH_DOMAIN: watch-next-500021.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: watch-next-500021
          VITE_API_URL: https://watch-next-547004818963.europe-west3.run.app
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push
        run: |
          BUILD_ID=$(gcloud builds submit \
            --tag=${{ env.IMAGE }}:${{ github.sha }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --async \
            --format='value(id)')

          echo "Build started: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --region=${{ env.REGION }} --format='value(status)' 2>/dev/null)
            if [[ "$STATUS" == "SUCCESS" ]]; then echo "✅ Build succeeded"; break; fi
            if [[ "$STATUS" == "FAILURE" || "$STATUS" == "TIMEOUT" || "$STATUS" == "CANCELLED" ]]; then
              echo "❌ Build failed: $STATUS"
              echo "🔗 https://console.cloud.google.com/cloud-build/builds;region=${{ env.REGION }}/$BUILD_ID?project=${{ env.PROJECT_ID }}"
              exit 1
            fi
            sleep 10
          done

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --memory=256Mi \
            --cpu=1 \
            --set-env-vars=NODE_ENV=production,ALLOWED_ORIGINS=https://adhi1419.github.io
