name: Deploy to Cloud Run

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: watch-next-500021
  REGION: europe-west3
  SERVICE: watch-next
  IMAGE: europe-west3-docker.pkg.dev/watch-next-500021/watch-next/watch-next

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push
        run: |
          BUILD_ID=$(gcloud builds submit \
            --tag=${{ env.IMAGE }}:${{ github.sha }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --async \
            --format='value(id)')

          echo "Build started: $BUILD_ID"
          echo "Waiting for build to complete..."

          if ! gcloud builds log "$BUILD_ID" --region=${{ env.REGION }} --stream 2>/dev/null; then
            while true; do
              STATUS=$(gcloud builds describe "$BUILD_ID" --region=${{ env.REGION }} --format='value(status)')
              if [[ "$STATUS" == "SUCCESS" ]]; then
                echo "✅ Build succeeded"
                break
              elif [[ "$STATUS" == "FAILURE" || "$STATUS" == "TIMEOUT" || "$STATUS" == "CANCELLED" ]]; then
                echo "❌ Build failed with status: $STATUS"
                echo "🔗 Logs: https://console.cloud.google.com/cloud-build/builds;region=${{ env.REGION }}/$BUILD_ID?project=${{ env.PROJECT_ID }}"
                exit 1
              fi
              sleep 10
            done
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --min-instances=1 \
            --set-env-vars=NODE_ENV=production
