name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: watch-next-500021
  REGION: europe-west3
  SERVICE: watch-next
  IMAGE: europe-west3-docker.pkg.dev/watch-next-500021/watch-next/watch-next

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push via Cloud Build
        run: |
          gcloud builds submit --tag=${{ env.IMAGE }}:${{ github.sha }} --project=${{ env.PROJECT_ID }} --region=${{ env.REGION }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --min-instances=1 \
            --set-env-vars=NODE_ENV=production
